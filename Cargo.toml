[package]
name = "area-translator"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A lightweight region OCR translator for GNOME Wayland"

[dependencies]
anyhow = "1"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast"] }
futures-util = "0.3"
gstreamer = { version = "0.24", features = ["v1_22"] }
gstreamer-app = { version = "0.24", features = ["v1_22"] }
gstreamer-video = { version = "0.24", features = ["v1_22"] }
libloading = "0.8"
lru = "0.16"
png = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
